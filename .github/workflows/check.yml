# Runs the same checks as `python check.py` on every push and pull request.
# A red result blocks merging, so a broken build cannot reach the live site.

name: check

# Every branch, not just main — the whole point is to catch problems
# before they are merged into the live site.
on: [push]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run all checks
        run: python check.py
