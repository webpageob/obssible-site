<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Junwoo</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<main>

<p class="name">Junwoo</p>
<!-- NAV:START -->
{{NAV}}
<!-- NAV:END -->

<article class="log" style="margin-top:0; padding-top:0; border-top:0;">
  <p class="log-date">{{DATE}}</p>
  <h3>{{TITLE}}</h3>
{{BODY}}
</article>

<section class="signup">
<div class="signup-box">
  <p class="eyebrow" style="margin-bottom:0.6rem">Subscribe</p>
  <p class="signup-line">Enjoyed this log? Get the next one by email, before it's public.</p>
  <form action="https://buttondown.com/api/emails/embed-subscribe/junwoo" method="post" class="embeddable-buttondown-form">
    <label class="sr-only" for="bd-email-post">Enter your email</label>
    <input type="email" name="email" id="bd-email-post" placeholder="you@email.com" required>
    <button type="submit">Subscribe</button>
  </form>
  <p class="note">Powered by <a href="https://buttondown.com/refer/junwoo" target="_blank">Buttondown</a>.</p>
</div>
</section>

<p style="margin-top:3rem;"><a href="./">← All logs</a></p>

<footer>
  <p><a href="mailto:hello@obssible.com">hello@obssible.com</a></p>
</footer>

</main>
</body>
</html>
